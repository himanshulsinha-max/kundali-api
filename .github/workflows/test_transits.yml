name: Test Transits

on:
  push:
    paths:
      - "transits.py"
      - "test_transits.py"
      - ".github/workflows/test_transits.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyswisseph

      - name: Run transit tests
        run: |
          python test_transits.py
